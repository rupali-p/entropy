<!doctype html>
<html
  style="
    background: #121212;
    color: white;
    font-family: sans-serif;
    text-align: center;
  "
>
  <body
    style="
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    "
    ;
  >
    <div>
      <h2>Kettlebell Loader</h2>
      <p>Target Weight (Total): <span id="maxDisplay"></span></p>
      <input
        type="number"
        min="0"
        step="0.25"
        id="target"
        value="0"
        style="padding: 10px; font-size: 1.2rem"
      />

      <div
        id="resultContainer"
        style="
          margin-top: 20px;
          font-size: 1.5rem;
          font-weight: bold;
          color: #00ff88;
        "
      >
        <text id="result">Nothing to see here </text>
        <br />
        <svg
          id="plates"
          viewBox="0 0 360 100"
          width="360"
          height="100"
          xmlns="http://www.w3.org/2000/svg"
        ></svg>
      </div>

      <svg
        id="kettlebell"
        width="100"
        height="120"
        viewBox="0 0 100 120"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M30 40C30 20 40 10 50 10C60 10 70 20 70 40"
          stroke="#555"
          stroke-width="8"
        />
        <circle cx="50" cy="70" r="50" fill="#222" />
        <text
          id="kettlebellWeight"
          x="50"
          y="75"
          fill="white"
          font-size="12"
          text-anchor="middle"
        >
          0kg
        </text>
      </svg>

      <script>
        const plates = [1.25, 1.5, 2];
        const kettleWeight = 1;
        const maxPerSize = 4;

        const maxTotalWeight = plates.reduce(
          (sum, p) => sum + p * maxPerSize,
          kettleWeight
        );

        const round2 = (n) => Math.round(n * 100) / 100;

        const calculatePlates = (targetWeight) => {
          if (targetWeight <= kettleWeight) return [];

          let bestCounts = null;
          let bestDiff = Infinity;

          for (let a = 0; a <= maxPerSize; a++) {
            for (let b = 0; b <= maxPerSize; b++) {
              for (let c = 0; c <= maxPerSize; c++) {
                const total =
                  kettleWeight + a * plates[0] + b * plates[1] + c * plates[2];
                const diff = total - targetWeight;

                if (
                  Math.abs(diff) < Math.abs(bestDiff) ||
                  (Math.abs(diff) === Math.abs(bestDiff) && diff > bestDiff)
                ) {
                  bestDiff = diff;
                  bestCounts = [a, b, c];
                }
              }
            }
          }

          const result = [];
          for (let i = 0; i < bestCounts[0]; i++) result.push(plates[0]);
          for (let i = 0; i < bestCounts[1]; i++) result.push(plates[1]);
          for (let i = 0; i < bestCounts[2]; i++) result.push(plates[2]);
          return result;
        };

        const targetInput = document.getElementById('target');
        targetInput.max = maxTotalWeight;
        document.getElementById('maxDisplay').textContent =
          '(max ' + maxTotalWeight + 'kg)';

        targetInput.addEventListener('input', (e) => {
          const target = parseFloat(e.target.value);

          document.getElementById('kettlebellWeight').innerHTML = target + 'kg';

          if (target < kettleWeight) {
            document.getElementById('result').innerText = 'Too light!';
            return;
          }

          if (target > maxTotalWeight) {
            document.getElementById('result').innerText =
              'Too heavy! Max is ' + maxTotalWeight + 'kg';
            return;
          }

          const platesToAdd = calculatePlates(target);

          const platesContainer = document.getElementById('plates');
          platesContainer.replaceChildren();

          const numCols = Math.ceil(platesToAdd.length / 3) || 1;
          const offsetX = (360 - numCols * 85) / 2;

          platesToAdd.forEach((plate, i) => {
            const col = Math.floor(i / 3);
            const row = i % 3;
            const x = offsetX + col * 85;
            const y = 10 + row * 30;

            const g = document.createElementNS(
              'http://www.w3.org/2000/svg',
              'g'
            );

            const rect = document.createElementNS(
              'http://www.w3.org/2000/svg',
              'rect'
            );
            rect.setAttribute('width', '75');
            rect.setAttribute('height', '25');
            rect.setAttribute('x', x);
            rect.setAttribute('y', y);
            rect.setAttribute('rx', '10');
            rect.setAttribute('ry', '20');
            rect.setAttribute('fill', '#00ff88');
            g.appendChild(rect);

            const text = document.createElementNS(
              'http://www.w3.org/2000/svg',
              'text'
            );
            text.setAttribute('x', x + 37.5);
            text.setAttribute('y', y + 16);
            text.setAttribute('fill', 'black');
            text.setAttribute('font-size', '10');
            text.setAttribute('text-anchor', 'middle');
            text.textContent = plate + 'kg';
            g.appendChild(text);

            platesContainer.appendChild(g);
          });

          const actualTotal =
            kettleWeight + platesToAdd.reduce((s, p) => s + p, 0);
          const tag = actualTotal === target ? '' : ' (~' + actualTotal + 'kg)';
          document.getElementById('result').innerHTML =
            'Kettlebell (' + kettleWeight + 'kg)' +
            (platesToAdd.length ? ' + ' + platesToAdd.join('kg, ') + 'kg' : '') +
            tag;
        });
      </script>
    </div>
  </body>
</html>
